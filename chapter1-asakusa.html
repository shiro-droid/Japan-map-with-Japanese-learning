<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浅草めぐり · 妈妈的日语散步</title>
<style>
:root{
  --paper:#FBF3E2;
  --paper-deep:#F3E7CC;
  --ink:#33302B;
  --shu:#C73E3A;
  --shu-deep:#A32E2C;
  --kon:#26466D;
  --gold:#D9A441;
  --moss:#7A8450;
  --white:#FFFDF7;
  --grey:#B9B0A0;
  --ok:#5E7F4E;
  --ng:#B23A3A;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif SC","Songti SC",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans SC","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  max-width:480px;margin:0 auto;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 10%, rgba(217,164,65,.06), transparent 40%),
                   radial-gradient(circle at 80% 90%, rgba(199,62,58,.05), transparent 40%);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--shu);color:var(--white);
  box-shadow:0 2px 0 var(--shu-deep);
}
#topbar .title{font-family:var(--serif);font-size:18px;letter-spacing:2px;font-weight:600}
#topbar .sub{font-size:10px;opacity:.85;letter-spacing:1px;margin-top:1px}
#btn-stamps{
  display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 11px;
  color:var(--white);font-size:12px;
}
#btn-stamps .seal-mini{width:14px;height:14px;border-radius:50%;background:var(--white);color:var(--shu);
  font-size:9px;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
#btn-back{display:none;align-items:center;gap:4px;color:var(--white);font-size:13px;padding:4px 8px 4px 0}
#btn-back .arr{font-size:16px}

/* ---------- views ---------- */
.view{display:none;animation:fadein .25s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- map ---------- */
#view-map{padding:18px 14px 30px}
.map-frame{
  position:relative;background:var(--paper-deep);border:2px solid var(--ink);border-radius:8px;
  padding:14px 10px 22px;box-shadow:4px 4px 0 rgba(51,48,43,.15);
}
.map-head{text-align:center;margin-bottom:6px}
.map-head h1{font-family:var(--serif);font-size:20px;letter-spacing:6px}
.map-head p{font-size:11px;color:#6d675c;letter-spacing:2px;margin-top:3px}
#map-canvas{position:relative;height:560px}
#map-canvas svg.path-bg{position:absolute;inset:0;width:100%;height:100%}
.lantern-node{
  position:absolute;transform:translate(-50%,-50%);text-align:center;width:108px;
}
.lantern-node .lamp{
  width:74px;height:88px;margin:0 auto;border-radius:42% 42% 46% 46%/38% 38% 52% 52%;
  background:radial-gradient(circle at 50% 30%, #E2554F, var(--shu) 55%, var(--shu-deep));
  border:2px solid var(--ink);position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(163,46,44,.35);
}
.lantern-node .lamp::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:34px;height:8px;background:var(--ink);border-radius:3px}
.lantern-node .lamp::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  width:30px;height:7px;background:var(--ink);border-radius:3px}
.lantern-node .lamp .nm{
  writing-mode:vertical-rl;font-family:var(--serif);color:var(--white);
  font-size:15px;letter-spacing:3px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.lantern-node .cnt{margin-top:9px;font-size:11px;color:#6d675c;background:var(--white);
  display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid #d8cdb6}
.lantern-node.done .cnt{background:var(--gold);color:var(--white);border-color:var(--gold)}
.lantern-node:not(.locked) .lamp{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 10px rgba(163,46,44,.35)}50%{box-shadow:0 4px 20px rgba(226,120,80,.6)}}
.lantern-node.locked .lamp{
  background:radial-gradient(circle at 50% 30%, #cfc8ba, var(--grey) 60%, #948c7c);
  box-shadow:none;animation:none;
}
.lantern-node.locked .lamp .nm{color:#f2eee4;text-shadow:none}
.lantern-node.locked .ribbon{
  position:absolute;top:34px;left:50%;transform:translate(-50%,0) rotate(-8deg);
  background:var(--ink);color:var(--paper);font-size:9px;letter-spacing:2px;padding:2px 8px;border-radius:2px;
}
.lantern-node.small{width:88px}
.lantern-node.small .lamp{width:56px;height:66px}
.lantern-node.small .lamp .nm{font-size:11px;letter-spacing:2px}
.map-foot{margin-top:10px;text-align:center;font-size:11px;color:#8a8272;letter-spacing:1px}

/* ---------- scene ---------- */
#view-scene{padding:0 0 26px}
.scene-head{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
.scene-head h2{font-family:var(--serif);font-size:20px;letter-spacing:4px}
.scene-head .prog{font-size:12px;color:#6d675c}
.scene-stage{position:relative;margin:4px 12px 0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;
  box-shadow:4px 4px 0 rgba(51,48,43,.15);background:#EAF2F4}
.scene-stage svg{display:block;width:100%;height:auto}
.spot{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:5;
  padding:6px;
}
.spot .dot{width:17px;height:17px;border-radius:50%;background:var(--shu);border:2px solid var(--white);
  box-shadow:0 0 0 3px rgba(199,62,58,.35);animation:pulse 1.8s ease-out infinite;position:relative}
.spot.learned .dot{background:var(--kon);box-shadow:0 0 0 3px rgba(38,70,109,.3)}
.spot.cleared .dot{background:var(--shu-deep);box-shadow:0 0 0 3px rgba(163,46,44,.35);animation:none}
.spot.gold .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.45);animation:none}
.spot.cleared .dot::after,.spot.gold .dot::after{content:"印";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:9px;font-family:var(--serif)}
@keyframes pulse{0%{box-shadow:0 0 0 3px rgba(199,62,58,.4)}70%{box-shadow:0 0 0 11px rgba(199,62,58,0)}100%{box-shadow:0 0 0 3px rgba(199,62,58,0)}}
.spot .tag{font-size:10px;background:rgba(255,253,247,.92);border:1px solid #cfc4ab;border-radius:999px;
  padding:2px 8px;letter-spacing:1px;white-space:nowrap}
.spot.egg .dot{background:var(--moss);box-shadow:0 0 0 3px rgba(122,132,80,.3);animation:none;opacity:.85}
.scene-tip{margin:12px 18px 0;font-size:12px;color:#8a8272;text-align:center;letter-spacing:1px}

/* egg speech bubble */
#egg-bubble{
  position:absolute;z-index:8;transform:translate(-50%,-115%);background:var(--white);border:1.5px solid var(--ink);
  border-radius:10px;padding:6px 11px;font-size:12px;white-space:nowrap;display:none;
  box-shadow:2px 2px 0 rgba(51,48,43,.2);
}
#egg-bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--ink);border-bottom:none}

/* ---------- bottom sheet ---------- */
#sheet-mask{position:fixed;inset:0;background:rgba(40,35,28,.45);z-index:60;display:none}
#sheet{
  position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:480px;z-index:70;
  background:var(--white);border-radius:20px 20px 0 0;border:2px solid var(--ink);border-bottom:none;
  max-height:86vh;overflow-y:auto;transition:transform .28s cubic-bezier(.2,.8,.25,1);
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));
}
#sheet.open{transform:translate(-50%,0)}
.sheet-grip{width:44px;height:4px;border-radius:2px;background:#d8cdb6;margin:2px auto 12px}
.sheet-eyebrow{font-size:11px;letter-spacing:3px;color:var(--shu);font-weight:600;margin-bottom:2px}
.sheet-title{font-family:var(--serif);font-size:21px;letter-spacing:2px;margin-bottom:12px}

/* learn card */
.word-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #ddd2ba}
.word-row .w-main{flex:1}
.word-row .w-kanji{font-family:var(--serif);font-size:26px;letter-spacing:2px}
.word-row .w-kana{font-size:13px;color:var(--kon);margin-top:2px;letter-spacing:1px}
.word-row .w-zh{font-size:12px;color:#7c7566;margin-top:2px}
.btn-tts{
  width:42px;height:42px;border-radius:50%;background:var(--kon);color:#fff;font-size:17px;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #16304f;
}
.btn-tts:active{transform:translateY(1px);box-shadow:0 1px 0 #16304f}
.learn-note{margin:14px 0 4px;padding:12px 14px;background:var(--paper);border-radius:10px;border:1px solid #e4d9c0}
.learn-note .n-ja{font-size:15px;line-height:1.7}
.learn-note .n-zh{font-size:12px;color:#7c7566;margin-top:6px;line-height:1.6}
.learn-note .n-play{margin-top:8px}
.link-plain{font-size:12px;color:var(--kon);text-decoration:underline;padding:6px 0}

/* buttons */
.btn-main{
  display:block;width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--shu);color:#fff;
  font-size:16px;letter-spacing:3px;box-shadow:0 3px 0 var(--shu-deep);font-weight:600;
}
.btn-main:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shu-deep)}
.btn-ghost{
  display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:none;color:#8a8272;
  font-size:13px;letter-spacing:2px;border:1.5px dashed #cfc4ab;
}

/* quiz */
.quiz-prog{display:flex;gap:6px;margin-bottom:14px}
.quiz-prog i{width:8px;height:8px;border-radius:50%;background:#e0d6bd}
.quiz-prog i.on{background:var(--shu)}
.quiz-prog i.done{background:var(--gold)}
.q-text{font-size:16px;line-height:1.7;margin-bottom:6px}
.q-text .jp{font-family:var(--serif);font-size:18px}
.q-listen{
  display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:12px;background:var(--paper);
  border-radius:10px;border:1px solid #e4d9c0;
}
.q-listen .hint{font-size:12px;color:#7c7566}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.opt{
  text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid #d8cdb6;background:var(--white);
  font-size:15px;line-height:1.5;transition:border-color .15s;
}
.opt .jp{font-family:var(--serif)}
.opt.correct{border-color:var(--ok);background:#F0F5EA;color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--ng);background:#FAEDEA;color:var(--ng)}
.opt:disabled{opacity:.92}
.q-explain{
  margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--paper);border-left:4px solid var(--gold);
  font-size:13px;line-height:1.7;display:none;
}
.q-explain .tr{color:var(--kon);font-family:var(--serif);display:block;margin-bottom:4px;font-size:14px}

/* result & stamp */
.result-wrap{text-align:center;padding:8px 0 4px}
.result-wrap .r-title{font-family:var(--serif);font-size:20px;letter-spacing:3px;margin-bottom:4px}
.result-wrap .r-sub{font-size:13px;color:#7c7566}
.seal{
  width:110px;height:110px;margin:18px auto 6px;border-radius:50%;background:var(--shu);
  display:flex;align-items:center;justify-content:center;position:relative;
  animation:stampin .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 4px 14px rgba(163,46,44,.4);
}
.seal .s-inner{
  width:92px;height:92px;border:2px solid rgba(255,255,255,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.seal .s-name{writing-mode:vertical-rl;font-family:var(--serif);color:#fff;font-size:17px;letter-spacing:3px;font-weight:600}
.seal.gold{background:var(--gold);box-shadow:0 4px 14px rgba(217,164,65,.5)}
@keyframes stampin{0%{transform:scale(2.1);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
.perfect-tag{display:inline-block;margin-top:6px;font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600}

/* ---------- omikuji ---------- */
.mikuji-box{
  margin:6px auto 0;width:120px;height:150px;border-radius:10px;border:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,#8B5A2B 0 14px,#7A4E24 14px 28px);position:relative;
  display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 rgba(51,48,43,.15);
}
.mikuji-box .hole{position:absolute;top:12px;width:26px;height:26px;border-radius:50%;background:#2e2013;border:2px solid var(--ink)}
.mikuji-box .label{writing-mode:vertical-rl;font-family:var(--serif);color:#fff;font-size:19px;letter-spacing:6px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.mikuji-box.shaking{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.mikuji-slip{
  margin:16px auto 0;max-width:270px;background:var(--white);border:1.5px solid var(--ink);padding:18px 16px;
  box-shadow:3px 3px 0 rgba(51,48,43,.15);display:none;animation:slipin .4s ease;
}
@keyframes slipin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mikuji-slip .m-rank{font-family:var(--serif);font-size:30px;text-align:center;letter-spacing:8px;margin-bottom:10px}
.mikuji-slip .m-rank.daikichi{color:var(--shu)}
.mikuji-slip .m-rank.kichi{color:var(--moss)}
.mikuji-slip .m-rank.kyo{color:var(--kon)}
.mikuji-slip .m-body{font-family:var(--serif);font-size:14px;line-height:2;letter-spacing:1px;white-space:pre-line}
.mikuji-slip .m-zh{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #d8cdb6;font-size:12px;color:#7c7566;line-height:1.7}
.mikuji-note{text-align:center;font-size:12px;color:#8a8272;margin-top:12px;letter-spacing:1px}

/* ---------- stamp book ---------- */
#view-stamps{padding:18px 16px 30px}
.book-frame{background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:18px 14px;
  box-shadow:4px 4px 0 rgba(51,48,43,.15)}
.book-frame h2{font-family:var(--serif);text-align:center;font-size:19px;letter-spacing:6px}
.book-frame .b-sub{text-align:center;font-size:11px;color:#8a8272;margin:4px 0 16px;letter-spacing:2px}
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stamp-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.stamp-cell .c-seal{
  width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.stamp-cell.got .c-seal{background:var(--shu);box-shadow:0 2px 8px rgba(163,46,44,.35)}
.stamp-cell.got.gold .c-seal{background:var(--gold);box-shadow:0 2px 8px rgba(217,164,65,.45)}
.stamp-cell.empty .c-seal{border:2px dashed #cfc4ab}
.stamp-cell .c-inner{width:62px;height:62px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.stamp-cell .c-name{writing-mode:vertical-rl;font-family:var(--serif);color:#fff;font-size:12px;letter-spacing:2px}
.stamp-cell.empty .c-name{color:#cfc4ab}
.stamp-cell.empty .c-inner{border-color:transparent}
.stamp-cell .c-label{font-size:10px;color:#8a8272;text-align:center;letter-spacing:1px}

/* help + guide */
#btn-help{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.14);color:#fff;font-size:14px;margin-left:auto;margin-right:8px}
#topbar{gap:8px}
#topbar-title{margin-right:auto}
.map-head .chap{font-size:10px;letter-spacing:8px;color:var(--shu);font-weight:700;margin-bottom:2px}
#guide,#ovl{position:fixed;inset:0;background:rgba(40,35,28,.55);z-index:120;display:none;
  align-items:center;justify-content:center;padding:24px}
.g-card{background:var(--white);border:2px solid var(--ink);border-radius:16px;max-width:340px;
  padding:22px 20px 18px;box-shadow:6px 6px 0 rgba(51,48,43,.25)}
.g-card h3{font-family:var(--serif);font-size:19px;letter-spacing:4px;text-align:center;margin-bottom:14px}
.g-card .g-step{display:flex;gap:10px;font-size:13.5px;line-height:1.65;margin-bottom:10px}
.g-card .g-ico{flex:none;font-size:17px}
</style>
</head>
<body>

<header id="topbar">
  <button id="btn-back"><span class="arr">‹</span> 地图</button>
  <div id="topbar-title">
    <div class="title">浅草めぐり</div>
    <div class="sub">ことばで巡る浅草一丁目</div>
  </div>
  <button id="btn-help" aria-label="怎么玩">？</button>
  <button id="btn-stamps"><span class="seal-mini">印</span><span id="stamp-count">0</span></button>
</header>

<!-- ============ MAP ============ -->
<main id="view-map" class="view active">
  <div class="map-frame">
    <div class="map-head">
      <p class="chap">第 一 章</p>
      <h1>浅草寺絵図</h1>
      <p>点亮灯笼，走进去看看 · 每处都藏着题</p>
    </div>
    <div id="map-canvas">
      <svg class="path-bg" viewBox="0 0 390 560" preserveAspectRatio="none" aria-hidden="true">
        <path d="M195 500 C 195 440, 195 400, 195 340 C 195 280, 195 250, 195 185"
              fill="none" stroke="#C73E3A" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" opacity=".55"/>
        <path d="M195 340 C 150 330, 120 315, 92 268" fill="none" stroke="#B9B0A0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".5"/>
        <path d="M195 360 C 250 355, 290 335, 316 300" fill="none" stroke="#B9B0A0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".5"/>
        <path d="M195 210 C 150 200, 110 185, 82 150" fill="none" stroke="#B9B0A0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".5"/>
        <path d="M195 480 C 250 478, 285 490, 308 500" fill="none" stroke="#B9B0A0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".5"/>
      </svg>
      <!-- nodes injected by JS -->
    </div>
    <div class="map-foot">灰灯笼＝集齐上一章全部金印后点亮</div>
  </div>
</main>

<!-- ============ SCENE ============ -->
<main id="view-scene" class="view">
  <div class="scene-head">
    <h2 id="scene-title"></h2>
    <span class="prog" id="scene-prog"></span>
  </div>
  <div class="scene-stage" id="scene-stage">
    <!-- svg + spots injected -->
    <div id="egg-bubble"></div>
  </div>
  <p class="scene-tip">红点＝新内容 · 蓝点＝点它做题（每次3题都不同）· 金印＝题库全部答完</p>
</main>

<!-- ============ STAMP BOOK ============ -->
<main id="view-stamps" class="view">
  <div class="book-frame">
    <h2>御朱印帳</h2>
    <p class="b-sub" id="book-sub"></p>
    <div class="stamp-grid" id="stamp-grid"></div>
  </div>
</main>

<!-- ============ BOTTOM SHEET ============ -->
<div id="sheet-mask"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div id="sheet-content"></div>
</div>

<script>
/* =====================================================
   DATA
===================================================== */
const SCENES = [
  {
    id:"kaminarimon", name:"雷門前広場", short:"雷門", chapter:1,
    svg:"s1",
    hotspots:[
      {
        id:"lantern", name:"雷門大提灯", x:50, y:46,
        learn:{
          words:[
            {jp:"雷門", kana:"かみなりもん", romaji:"kaminarimon", zh:"雷门（浅草寺的正门）"},
            {jp:"提灯", kana:"ちょうちん", romaji:"chōchin", zh:"灯笼"},
            {jp:"入口", kana:"いりぐち", romaji:"iriguchi", zh:"入口"},

/* =====================================================
   STORAGE  (window.storage -> localStorage -> memory)
===================================================== */
const SAVE_KEY = "asakusa-meguri-save";
let state = { learned:{}, cleared:{}, gold:{}, qdone:{}, omikuji:null, eggTaps:{}, seenGuide:false };

async function loadState(){
  if (window.storage) {
    try {
      const r = await window.storage.get(SAVE_KEY);
      if (r && r.value) { state = Object.assign(state, JSON.parse(r.value)); return; }
    } catch(e){ /* key missing or unavailable */ }
  }
  try {
    const v = localStorage.getItem(SAVE_KEY);
    if (v) state = Object.assign(state, JSON.parse(v));
  } catch(e){}
}
async function saveState(){
  const v = JSON.stringify(state);
  if (window.storage) {
    try { await window.storage.set(SAVE_KEY, v); return; } catch(e){}
  }
  try { localStorage.setItem(SAVE_KEY, v); } catch(e){}
}

/* =====================================================
   TTS
===================================================== */
let jaVoice = null;
function findJaVoice(){
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices();
  if (!vs || !vs.length) return null;
  const ja = vs.filter(v=>v.lang && v.lang.replace("_","-").toLowerCase().indexOf("ja")===0);
  if (!ja.length) return null;
  const pref = ja.find(v=>/Kyoko|Otoya|Google\s*日本語|Google Japanese|Sayaka|Haruka/i.test(v.name));
  return pref || ja[0];
}
function ensureVoice(){ if(!jaVoice) jaVoice = findJaVoice(); return jaVoice; }
if ("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = ()=>{ jaVoice = findJaVoice(); };
  let _vtries = 0;
  const _vt = setInterval(()=>{ if (ensureVoice() || ++_vtries>12) clearInterval(_vt); }, 300);
}
function speak(text, rate){
  if (!("speechSynthesis" in window)){ toast("这个浏览器不支持语音朗读"); return; }
  const v = ensureVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (v){ u.voice = v; }
  else { toast("没找到日语语音包：请在手机系统设置里添加日语语音，否则可能用中文声音朗读"); }
  u.rate = rate || 0.85;
  speechSynthesis.speak(u);
}
let _toastT = null;
function toast(msg){
  let t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#33302B;color:#FBF3E2;padding:10px 16px;border-radius:10px;font-size:12px;z-index:99;max-width:80%;text-align:center;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.3);display:none";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(_toastT);
  _toastT = setTimeout(()=>{ t.style.display = "none"; }, 3400);
}

const $ = s => document.querySelector(s);
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function shuffledOptions(q){
  const idx = q.options.map((_,i)=>i);
  for (let i=idx.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  return idx;
}
function quizHotspots(scene){ return scene.hotspots.filter(h=>h.learn); }
function totalStamps(){ return SCENES.reduce((n,s)=>n+quizHotspots(s).length,0); }
function stampCount(){ return Object.keys(state.cleared).length; }

const NODE_POS = {
  kaminarimon:{x:50,y:88}, nakamise:{x:50,y:60}, hondo:{x:50,y:30},
  denboin:{x:20,y:45}, sumida:{x:81,y:52},
  hoppy:{x:20,y:17}, station:{x:80,y:88}
};
function chapterAllGold(ch){
  return SCENES.filter(s=>s.chapter===ch)
    .every(s=>quizHotspots(s).every(h=>state.gold[h.id]));
}
function chapterUnlocked(ch){
  if (ch===1) return true;
  return chapterAllGold(ch-1);
}
function renderMap(){
  const canvas = $("#map-canvas");
  canvas.querySelectorAll(".lantern-node").forEach(n=>n.remove());
  SCENES.forEach(sc=>{
    const hs = quizHotspots(sc);
    const goldN = hs.filter(h=>state.gold[h.id]).length;
    const unlocked = chapterUnlocked(sc.chapter);
    const small = sc.chapter!==1;
    const node = el("div","lantern-node"+(small?" small":"")+(unlocked?"":" locked")+(goldN===hs.length&&unlocked?" done":""));
    node.style.left = NODE_POS[sc.id].x+"%";
    node.style.top = NODE_POS[sc.id].y+"%";
    node.innerHTML = '<div class="lamp"><span class="nm">'+sc.short+'</span>'+
      (unlocked?'':'<span class="ribbon">'+sc.chapter+'章</span>')+'</div>'+
      (unlocked?('<div class="cnt">金 '+goldN+' / '+hs.length+'</div>'):'<div class="cnt">🔒</div>');
    node.addEventListener("click", ()=>{
      if (!unlocked){ toast("第"+(sc.chapter-1)+"章の全部の地点で金印を集めると、ここが点亮されます"); return; }
      openScene(sc);
    });
    canvas.appendChild(node);
  });
  $("#stamp-count").textContent = stampCount()+"/"+totalStamps();
}

function openScene(sc){
  currentScene = sc;
  $("#scene-title").textContent = sc.name;
  const stage = $("#scene-stage");
  stage.innerHTML = SVG_ART[sc.svg] + '<div id="egg-bubble"></div>';
  sc.hotspots.forEach(h=>{
    const spot = el("button","spot"+(h.egg?" egg":""));
    if (state.gold[h.id]) spot.classList.add("gold");
    else if (state.cleared[h.id]) spot.classList.add("cleared");
    else if (state.learned[h.id]) spot.classList.add("learned");
    spot.style.left = h.x+"%";
    spot.style.top = h.y+"%";
    spot.innerHTML = '<span class="dot"></span><span class="tag">'+h.name+'</span>';
    spot.addEventListener("click", ()=>tapHotspot(h, spot));
    stage.appendChild(spot);
  });
  updateSceneProg();
  show("view-scene");
}
function updateSceneProg(){
  const hs = quizHotspots(currentScene);
  const done = hs.filter(h=>state.gold[h.id]).length;
  $("#scene-prog").textContent = "金印 "+done+" / "+hs.length;
  $("#stamp-count").textContent = stampCount()+"/"+totalStamps();
}

/* =====================================================
   HOTSPOT TAP
===================================================== */
function tapHotspot(h, spotEl){
  if (h.egg) return tapEgg(h, spotEl);
  if (h.mikuji) return openOmikuji();
  if (!state.learned[h.id]) openLearn(h, false);
  else openQuiz(h);
}

/* ---------- easter eggs ---------- */
function tapEgg(h, spotEl){
  state.eggTaps[h.id] = (state.eggTaps[h.id]||0)+1;
  const n = state.eggTaps[h.id];
  const bubble = $("#egg-bubble");
  bubble.style.left = h.x+"%";
  bubble.style.top = (h.y-6)+"%";
  bubble.textContent = (n>=h.eggFinalAt) ? h.eggFinal : h.eggLines[(n-1)%h.eggLines.length];
  bubble.style.display = "block";
  clearTimeout(bubble._t);
  bubble._t = setTimeout(()=>{ bubble.style.display="none"; }, 1800);
  // animation
  if (h.id==="pigeons"){
    const g = $("#pigeon-group");
    if (g){
      g.style.transition = "transform .6s ease";
      g.style.transform = "translateY(-34px)";
      setTimeout(()=>{ g.style.transform="translateY(0)"; }, 650);
    }
  }
  if (h.id==="cat"){
    const tail = $("#cat-tail");
    if (tail){
      tail.setAttribute("d", n%2 ? "M172 310 Q158 300 170 294" : "M172 310 Q160 316 168 300");
    }
  }
  saveState();
}

function bindTts(){
  document.querySelectorAll(".btn-tts").forEach(b=>{

}

/* ---------- quiz ---------- */
function shuffleArr(a){
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function openQuiz(h){
  const pool = h.questions;
  const doneSet = state.qdone[h.id] || {};
  const undone = shuffleArr(pool.map((_,i)=>i).filter(i=>!doneSet[i]));
  const doneIdx = shuffleArr(pool.map((_,i)=>i).filter(i=>doneSet[i]));
  const want = Math.min(3, pool.length);
  const picks = undone.slice(0, want);
  let di = 0;
  while (picks.length < want && di < doneIdx.length){ picks.push(doneIdx[di++]); }
  const run = { qi:picks, i:0, wrong:0, order:picks.map(pi=>shuffledOptions(pool[pi])) };
  renderQuestion(h, run);
}
function renderQuestion(h, run){
  const q = h.questions[run.qi[run.i]];
  const ord = run.order[run.i];
  let html = '<div class="sheet-eyebrow">'+h.name+'</div>';
  html += '<div class="quiz-prog">'+run.qi.map((_,k)=>
    '<i class="'+(k<run.i?"done":k===run.i?"on":"")+'"></i>').join("")+'</div>';

  if (q.type==="listen"){
    html += '<div class="q-text">听一遍，选出正确的意思：</div>'+
      '<div class="q-listen"><button class="btn-tts" data-say="'+(q.ttsKana||q.tts)+'">🔊</button>'+
      '<span class="hint">可以反复播放 · 真实语速</span></div>';
  } else {
    html += '<div class="q-text">'+
      (q.type==="read" ? '<span class="jp">'+q.prompt+'</span>' : q.prompt)+'</div>';
  }
  html += '<div class="opts">'+ord.map(oi=>
    '<button class="opt'+((q.jpOptions||q.type==="read")?' jp':'')+'" data-oi="'+oi+'">'+q.options[oi]+'</button>').join("")+'</div>';
  html += '<div class="q-explain" id="q-explain"></div>';
  html += '<button class="btn-main" id="btn-next" style="display:none"></button>';
  html += '<button class="link-plain" id="btn-review" style="margin-top:8px">复习学习卡</button>';

  openSheet(html);
  bindTts();
  if (q.type==="listen") speak(q.ttsKana||q.tts);

  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const chosen = Number(btn.dataset.oi);
      const nextBtn = $("#btn-next");
      document.querySelectorAll(".opt").forEach(b=>{
        b.disabled = true;
        if (Number(b.dataset.oi)===q.answer) b.classList.add("correct");
      });
      if (chosen!==q.answer){
        btn.classList.add("wrong");
        run.wrong++;
        nextBtn.dataset.retry = "1";
        nextBtn.textContent = "再答一次（答对才能过）";
      } else {
        if (!state.qdone[h.id]) state.qdone[h.id] = {};
        state.qdone[h.id][run.qi[run.i]] = true;
        await saveState();
        nextBtn.dataset.retry = "";
        nextBtn.textContent = (run.i<run.qi.length-1?"下一题":"看结果");
      }
      const ex = $("#q-explain");
      let extra = "";
      if (q.type==="listen"){
        extra = '<span class="tr">「'+q.tts+'」</span>'+
          '<span style="display:block;color:#26466D;font-size:12px;margin-bottom:6px">'+(q.ttsKana||"")+'</span>';
      }
      let sayAfter = null;
      if (q.type==="read") sayAfter = q.options[q.answer];
      if (q.phraseKana) sayAfter = q.phraseKana;
      ex.innerHTML = extra + q.explain +
        (sayAfter ? '<div style="margin-top:8px"><button class="btn-tts" data-say="'+sayAfter+'" style="width:34px;height:34px;font-size:14px">🔊</button> <span style="font-size:11px;color:#8a8272">听正确答案</span></div>' : '');
      ex.style.display = "block";
      bindTts();
      nextBtn.style.display = "block";
    });
  });
  $("#btn-next").addEventListener("click", ()=>{
    if ($("#btn-next").dataset.retry){
      run.order[run.i] = shuffledOptions(q);
      renderQuestion(h, run);
      return;
    }
    if (run.i < run.qi.length-1){ run.i++; renderQuestion(h, run); }
    else finishQuiz(h, run);
  });
  $("#btn-review").addEventListener("click", ()=>openLearn(h, true));
}
async function finishQuiz(h, run){
  const pool = h.questions;
  const doneSet = state.qdone[h.id] || {};
  const dcount = Object.keys(doneSet).length;
  const nowGold = dcount >= pool.length;
  const newGold = nowGold && !state.gold[h.id];
  state.cleared[h.id] = true;
  if (nowGold) state.gold[h.id] = true;
  await saveState();
  let html = '<div class="result-wrap">'+
    '<div class="r-title">'+(nowGold?"金印達成！":"通関！")+'</div>'+
    '<div class="r-sub">'+(nowGold ? "这里的题全部答完了，盖金印" :
      ("本处题库已答完 "+dcount+" / "+pool.length+" 题<br>每次进来题目会换，把剩下的答完就是金印"))+'</div>'+
    '<div class="seal'+(nowGold?" gold":"")+'"><div class="s-inner"><span class="s-name">'+h.name+'</span></div></div>'+
    (nowGold?'<span class="perfect-tag">金 印</span>':'')+
    '</div>'+
    '<button class="btn-main" id="btn-close-result">返回场景</button>'+
    (!nowGold?'<button class="btn-ghost" id="btn-retry">继续做剩下的题</button>':'');
  openSheet(html);
  $("#btn-close-result").addEventListener("click", ()=>{
    closeSheet(); refreshSpots();
    if (newGold) checkChapter(h);
  });
  const retry = $("#btn-retry");
  if (retry) retry.addEventListener("click", ()=>openQuiz(h));
}
function checkChapter(h){
  const sc = SCENES.find(s=>s.hotspots.includes(h));
  if (!sc) return;
  if (!chapterAllGold(sc.chapter)) return;
  if (sc.chapter < 3) showCongrats(sc.chapter);
  else showFinale();
}

/* =====================================================
   OMIKUJI
===================================================== */
function drawOmikuji(excludeKyo){
  const groups = excludeKyo
    ? [{idx:[0,1,2], w:30},{idx:[3,4,5,6], w:70}]
    : OMIKUJI_WEIGHTS;
  let r = Math.random()*100, pick = groups[0];
  for (const g of groups){ if (r < g.w){ pick = g; break; } r -= g.w; }
  return pick.idx[Math.floor(Math.random()*pick.idx.length)];
}
function openOmikuji(){
  const today = todayStr();
  const drawn = state.omikuji && state.omikuji.date===today;
  const prevWasKyo = state.omikuji && state.omikuji.date!==today && OMIKUJI[state.omikuji.idx].cls==="kyo";
  let html = '<div class="sheet-eyebrow">毎日一回</div><div class="sheet-title">おみくじ</div>'+
    '<div class="mikuji-box" id="mikuji-box"><div class="hole"></div><span class="label">御神籤</span></div>'+
    '<div class="mikuji-slip" id="mikuji-slip"></div>';
  if (drawn){
    html += '<p class="mikuji-note">今天的签就是它了 · 明日また来てね</p>';
  } else {
    html += '<button class="btn-main" id="btn-draw">摇一支签</button>'+
      '<p class="mikuji-note">每天一支，新的一天新的运气</p>';
  }
  openSheet(html);
  if (drawn){ showSlip(state.omikuji.idx, true); }
  else {
    $("#btn-draw").addEventListener("click", async ()=>{
      const box = $("#mikuji-box");
      box.classList.add("shaking");
      $("#btn-draw").style.display = "none";
      setTimeout(async ()=>{
        const idx = drawOmikuji(prevWasKyo);
        state.omikuji = {date:today, idx:idx};
        await saveState();
        showSlip(idx, false);
      }, 900);
    });
  }
}
function showSlip(idx, instant){
  const f = OMIKUJI[idx];
  const slip = $("#mikuji-slip");
  slip.innerHTML = '<div class="m-rank '+f.cls+'">'+f.rank+'</div>'+
    '<div class="m-body">'+f.body+'</div>'+
    '<div class="m-zh" id="m-zh">'+f.zh+'</div>'+
    '<button class="link-plain" id="btn-kaisetsu">解説（认输看中文）</button>'+
    (f.cls==="kyo"?'<p class="mikuji-note">凶签系在树上留下就好，明天再来抽过</p>':'');
  slip.style.display = "block";
  if (instant) slip.style.animation = "none";
  $("#btn-kaisetsu").addEventListener("click", function(){
    $("#m-zh").style.display = "block";
    this.style.display = "none";
  });
}

/* =====================================================
   STAMP BOOK
===================================================== */
function renderStamps(){
  const grid = $("#stamp-grid");
  grid.innerHTML = "";
  let got = 0;
  SCENES.forEach(sc=>{
    quizHotspots(sc).forEach(h=>{
      const has = !!state.cleared[h.id];
      const gold = !!state.gold[h.id];
      if (has) got++;
      const cell = el("div","stamp-cell "+(has?("got"+(gold?" gold":"")):"empty"));
      cell.innerHTML = '<div class="c-seal"><div class="c-inner"><span class="c-name">'+h.name+'</span></div></div>'+
        '<div class="c-label">'+sc.short+(gold?' · 金':'')+'</div>';
      grid.appendChild(cell);
    });
  });
  $("#book-sub").textContent = "已集 "+got+" / "+totalStamps()+" 枚 · 答完一处全部题目得金印";
}

/* =====================================================
   INIT
===================================================== */
(function bindHelp(){
  const b = document.getElementById("btn-help");
  if (b) b.addEventListener("click", ()=>showGuide(false));
})();
function showGuide(firstTime){
  let g = document.getElementById("guide");
  if (!g){
    g = document.createElement("div");
    g.id = "guide";
    document.body.appendChild(g);
  }
  g.innerHTML = '<div class="g-card">'+
    '<h3>遊び方 · 怎么玩</h3>'+
    '<div class="g-step"><span class="g-ico">🏮</span><span>点地图上的<b>红灯笼</b>，走进一个区域。灰灯笼还在建，以后更新。</span></div>'+
    '<div class="g-step"><span class="g-ico">🔴</span><span><b>红点</b>是新内容：先看学习卡，点 🔊 听发音，看完按「记住了」。</span></div>'+
    '<div class="g-step"><span class="g-ico">🔵</span><span>变<b>蓝</b>之后再点它，开始做题：每次随机3题，答错当场重答。</span></div>'+
    '<div class="g-step"><span class="g-ico">✨</span><span>每个地点藏着5道题，<b>全部答完</b>朱印就变金印。<b>一章集齐全部金印</b>，下一章的灯笼自动点亮。</span></div>'+
    '<div class="g-step"><span class="g-ico">🎋</span><span><b>おみくじ</b>每天能抽一支新签；集到的朱印在右上角「印」里随时翻看。</span></div>'+
    '<button class="btn-main" id="btn-guide-go">开始逛浅草</button></div>';
  g.style.display = "flex";
  document.getElementById("btn-guide-go").addEventListener("click", async ()=>{
    g.style.display = "none";
    if (firstTime){ state.seenGuide = true; await saveState(); }
  });
}
(async function init(){
  await loadState();
  renderMap();
  if (!state.seenGuide) showGuide(true);
})();

</script>
</body>
</html>
